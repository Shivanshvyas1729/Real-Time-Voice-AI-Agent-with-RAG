    "pipecat-ai[deepgram,elevenlabs,groq,silero,websocket]>=0.0.100,<1.0.0",
    "protobuf>=5.29.0",
    "pydantic-settings>=2.12.0",
    "pymongo>=4.16.0",
    "pypdf>=6.6.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "uvicorn>=0.40.0",
