name: Deploy to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY_BACKEND: ${{ secrets.ECR_REPOSITORY_BACKEND || 'rag-voice-agent-backend' }}
  ECR_REPOSITORY_FRONTEND: ${{ secrets.ECR_REPOSITORY_FRONTEND || 'rag-voice-agent-frontend' }}
  ECS_SERVICE_BACKEND: ${{ secrets.ECS_SERVICE_BACKEND || 'rag-voice-agent-backend-service' }}
  ECS_SERVICE_FRONTEND: ${{ secrets.ECS_SERVICE_FRONTEND || 'rag-voice-agent-frontend-service' }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER || 'rag-voice-agent-cluster' }}
  ECS_TASK_DEFINITION_BACKEND: ${{ secrets.ECS_TASK_DEFINITION_BACKEND || '.github/workflows/task-definition-backend.json' }}
  ECS_TASK_DEFINITION_FRONTEND: ${{ secrets.ECS_TASK_DEFINITION_FRONTEND || '.github/workflows/task-definition-frontend.json' }}
  CONTAINER_NAME_BACKEND: ${{ secrets.CONTAINER_NAME_BACKEND || 'rag-voice-agent-backend-container' }}
  CONTAINER_NAME_FRONTEND: ${{ secrets.CONTAINER_NAME_FRONTEND || 'rag-voice-agent-frontend-container' }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID and Render Task Definitions
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Using AWS Account ID: $ACCOUNT_ID"
          sed "s/\${AWS_ACCOUNT_ID}/$ACCOUNT_ID/g; s/\${AWS_REGION}/${{ env.AWS_REGION }}/g" \
            .github/workflows/task-definition-backend.json.template > .github/workflows/task-definition-backend.json
          sed "s/\${AWS_ACCOUNT_ID}/$ACCOUNT_ID/g; s/\${AWS_REGION}/${{ env.AWS_REGION }}/g" \
            .github/workflows/task-definition-frontend.json.template > .github/workflows/task-definition-frontend.json

      - name: Ensure ECS Services Exist
        run: |
          STACK_NAME="rag-voice-agent-stack"
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "${{ env.AWS_REGION }}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          PRIVATE_SUBNET_1=$(get_output PrivateSubnet1)
          PRIVATE_SUBNET_2=$(get_output PrivateSubnet2)
          BACKEND_SG=$(get_output BackendSecurityGroup)
          FRONTEND_SG=$(get_output FrontendSecurityGroup)
          BACKEND_TG_ARN=$(get_output BackendTargetGroupArn)
          FRONTEND_TG_ARN=$(get_output FrontendTargetGroupArn)

          # Ensure Service-Linked Role exists
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>/dev/null || true

          # Create Backend Service if missing
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE_BACKEND }}" --region "${{ env.AWS_REGION }}" --query "services[?status=='ACTIVE'].serviceName" --output text | grep -q "${{ env.ECS_SERVICE_BACKEND }}"; then
            echo "Initial Backend Service setup..."
            aws ecs register-task-definition --cli-input-json file://${{ env.ECS_TASK_DEFINITION_BACKEND }} --region "${{ env.AWS_REGION }}"
            aws ecs create-service \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --service-name "${{ env.ECS_SERVICE_BACKEND }}" \
              --task-definition "rag-voice-agent-backend-td" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET_1,$PRIVATE_SUBNET_2],securityGroups=[$BACKEND_SG],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$BACKEND_TG_ARN,containerName=${{ env.CONTAINER_NAME_BACKEND }},containerPort=8000" \
              --region "${{ env.AWS_REGION }}"
          fi

          # Create Frontend Service if missing
          if ! aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" --services "${{ env.ECS_SERVICE_FRONTEND }}" --region "${{ env.AWS_REGION }}" --query "services[?status=='ACTIVE'].serviceName" --output text | grep -q "${{ env.ECS_SERVICE_FRONTEND }}"; then
            echo "Initial Frontend Service setup..."
            aws ecs register-task-definition --cli-input-json file://${{ env.ECS_TASK_DEFINITION_FRONTEND }} --region "${{ env.AWS_REGION }}"
            aws ecs create-service \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --service-name "${{ env.ECS_SERVICE_FRONTEND }}" \
              --task-definition "rag-voice-agent-frontend-td" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET_1,$PRIVATE_SUBNET_2],securityGroups=[$FRONTEND_SG],assignPublicIp=DISABLED}" \
              --load-balancers "targetGroupArn=$FRONTEND_TG_ARN,containerName=${{ env.CONTAINER_NAME_FRONTEND }},containerPort=80" \
              --region "${{ env.AWS_REGION }}"
          fi

      # ------------------------------------------------------------------
      # Build and Push Backend
      # ------------------------------------------------------------------
      - name: Build, tag, and push backend image to Amazon ECR
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new backend image ID in the Amazon ECS task definition
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_BACKEND }}
          container-name: ${{ env.CONTAINER_NAME_BACKEND }}
          image: ${{ steps.build-backend.outputs.image }}

      - name: Deploy Backend Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ------------------------------------------------------------------
      # Build and Push Frontend
      # ------------------------------------------------------------------
      - name: Build, tag, and push frontend image to Amazon ECR
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Note: Build args must match deployment environment.
          # Here we assume relative paths, so no absolute URL needed.
          docker build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=/api/v1 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new frontend image ID in the Amazon ECS task definition
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION_FRONTEND }}
          container-name: ${{ env.CONTAINER_NAME_FRONTEND }}
          image: ${{ steps.build-frontend.outputs.image }}

      - name: Deploy Frontend Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true